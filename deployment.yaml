apiVersion: apps/v1
kind: Deployment
metadata:
  name: rupp-final-deployment
  namespace: rupp
  labels:
    app: rupp-final
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rupp-final
  template:
    metadata:
      labels:
        app: rupp-final
    spec:
      containers:
        - name: rupp-final-container
          image: sayson/rupp-final:18
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: rupp-final-service
  namespace: rupp
spec:
  type: ClusterIP
  selector:
    app: rupp-final
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rupp-final-ingress
  namespace: rupp
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod" 
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portfolio.devopskh.space 
      secretName: portfolio-devopskh-tls
  rules:
    - host: portfolio.devopskh.space 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rupp-final-service
                port:
                  number: 80
