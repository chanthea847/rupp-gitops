apiVersion: apps/v1
kind: Deployment
metadata:
  name: rupp-final-deployment
  namespace: rupp
  labels:
    app: rupp-final
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rupp-final
  template:
    metadata:
      labels:
        app: rupp-final
    spec:
      containers:
        - name: rupp-final-container
          image: sayson/rupp-final:13
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rupp-final-service
  namespace: rupp 
spec:
  type: NodePort
  selector:
    app: rupp-final
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
